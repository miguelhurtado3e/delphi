// ============================ MOTOR (probado con las tablas del profesor) ============================
//<ENGINE>
const Z_MAX = 4.09;
function invNorm(p){
  const a=[-3.969683028665376e+01,2.209460984245205e+02,-2.759285104469687e+02,1.383577518672690e+02,-3.066479806614716e+01,2.506628277459239e+00];
  const b=[-5.447609879822406e+01,1.615858368580409e+02,-1.556989798598866e+02,6.680131188771972e+01,-1.328068155288572e+01];
  const c=[-7.784894002430293e-03,-3.223964580411365e-01,-2.400758277161838e+00,-2.549732539343734e+00,4.374664141464968e+00,2.938163982698783e+00];
  const d=[7.784695709041462e-03,3.224671290700398e-01,2.445134137142996e+00,3.754408661907416e+00];
  const pl=0.02425, ph=1-pl; let q,r;
  if(p<pl){q=Math.sqrt(-2*Math.log(p));return (((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);}
  if(p>ph){q=Math.sqrt(-2*Math.log(1-p));return -(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);}
  q=p-0.5;r=q*q;
  return (((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q/(((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1);
}
function zOf(p){ if(p<=0) return -Z_MAX; if(p>=1) return Z_MAX; return Math.max(-Z_MAX, Math.min(Z_MAX, invNorm(p))); }
const sumArr = a => a.reduce((s,x)=>s+x,0);
// rows: [{code, counts:[n por categoria, de la mejor a la peor]}], K = numero de categorias
function thorgenson(rows, K){
  const valid = rows.filter(r => sumArr(r.counts) > 0);
  const res = valid.map(r=>{
    const n = sumArr(r.counts); let acc = 0;
    const cum = r.counts.map(c => (acc += c));
    const rel = cum.map(c => c/n);
    const z = rel.map(zOf);
    const suma = sumArr(z);
    return {code:r.code, counts:r.counts, n, cum, rel, z, suma, prm: suma/K};
  });
  const m = res.length;
  const cuts = Array.from({length:K}, (_,k) => m ? sumArr(res.map(r=>r.z[k]))/m : 0);
  const colSums = Array.from({length:K}, (_,k) => sumArr(res.map(r=>r.z[k])));
  const N = m ? sumArr(res.map(r=>r.prm))/m : 0;
  res.forEach(r=>{
    r.np = N - r.prm;
    r.cat = K-1;
    for(let k=0;k<K-1;k++){ if(r.np < cuts[k]){ r.cat = k; break; } }
  });
  return {rows:res, cuts, colSums, N, K, skipped: rows.length - m};
}

function gauss(){ let u=0,v=0; while(!u)u=Math.random(); while(!v)v=Math.random(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
const MU={alto:4.4,medio:3.5,bajo:2.5};
function sel(opts,val,handler,blank){ return `<select onchange="${handler}">${blank?'<option value=""></option>':''}${opts.map(o=>`<option value="${esc(o[0])}"${String(o[0])===String(val)?' selected':''}>${esc(o[1])}</option>`).join('')}</select>`; }
function sampleLikert(mu){ return Math.max(1,Math.min(5,Math.round(mu+gauss()*0.8))); }

function resultHTML(res, labels, opts){
  opts=opts||{}; const K=res.K; const names=labels.map(l=>l.k);
  if(!res.rows.length) return '<p class="mut">Aún no hay datos para calcular.</p>';
  const head=`<tr><th class="l">${opts.rowName||'Ítem'}</th>${names.map(n=>`<th>${n}</th>`).join('')}<th>Suma</th><th>Prm</th><th>N − Prm</th><th>Categoría</th></tr>`;
  const body=res.rows.map(r=>`<tr><td class="l"><b>${esc(r.code)}</b></td>${r.z.map(z=>`<td>${f2(z)}</td>`).join('')}<td>${f2(r.suma)}</td><td>${f2(r.prm)}</td><td>${f2(r.np)}</td><td><b>${labels[r.cat].k}</b></td></tr>`).join('');
  const foot=`<tr><th class="l">Suma</th>${res.colSums.map(x=>`<th>${f2(x)}</th>`).join('')}<th>${f2(sumArr(res.rows.map(r=>r.suma)))}</th><th>${f2(sumArr(res.rows.map(r=>r.prm)))}</th><th></th><th></th></tr>
  <tr><th class="l">Puntos de corte</th>${res.cuts.map(x=>`<th style="color:var(--cut)">${f2(x)}</th>`).join('')}<th></th><th>÷ ${res.rows.length} = ${f2(res.N)}</th><th></th><th></th></tr>`;
  const cnt=`<tr><th class="l">${opts.rowName||'Ítem'}</th><th>n</th>${names.map(n=>`<th>${n}</th>`).join('')}<th></th>${names.map(n=>`<th>${n} acum.</th>`).join('')}<th></th>${names.map(n=>`<th>${n} rel. acum.</th>`).join('')}</tr>` +
    res.rows.map(r=>`<tr><td class="l"><b>${esc(r.code)}</b></td><td>${r.n}</td>${r.counts.map(c=>`<td>${c}</td>`).join('')}<td></td>${r.cum.map(c=>`<td>${c}</td>`).join('')}<td></td>${r.rel.map(c=>`<td>${f2(c)}</td>`).join('')}</tr>`).join('');
  const repCnt=`<h3>Frecuencias absolutas</h3><table><tr><th class="l">${opts.rowName||'Ítem'}</th><th>n</th>${names.map(n=>`<th>${n}</th>`).join('')}</tr>${res.rows.map(r=>`<tr><td class="l"><b>${esc(r.code)}</b></td><td>${r.n}</td>${r.counts.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table>`;
  return `${opts.report?repCnt:`<details><summary>Ver frecuencias absolutas, acumuladas y relativas acumuladas</summary><div class="scroll"><table>${cnt}</table></div></details>`}
  <h3>Función recíproca de la distribución normal y puntos de corte</h3>
  <div class="scroll"><table>${head}${body}${foot}</table></div>
  <p class="mut" style="font-size:12px">Los valores 0 y 1 de la frecuencia relativa acumulada se truncan en ∓${Z_MAX}. Un ítem pertenece a la primera categoría cuyo punto de corte supera su valor N − Prm. N = promedio de los Prm.${res.skipped?` Se omitieron ${res.skipped} ítems sin respuestas.`:''}</p>
  ${lineSVG(res,labels)}
  ${analysisText(res,labels,opts)}`;
}
function lineSVG(res,labels){
  const K=res.K, W=900, H=210, padL=30, padR=30, base=150;
  const finite=res.cuts.slice(0,K-1).filter(c=>c<Z_MAX-0.005);
  const vals=res.rows.map(r=>r.np).concat(finite);
  let lo=Math.min(...vals)-0.6, hi=Math.max(...vals)+0.6; if(hi-lo<2){hi=lo+2;}
  const X=v=>padL+(v-lo)/(hi-lo)*(W-padL-padR);
  const bounds=[lo].concat(res.cuts.slice(0,K-1).map(c=>Math.min(Math.max(c,lo),hi))).concat([hi]);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px" role="img" aria-label="Recta con puntos de corte e indicadores">`;
  const tints=['#2e7d3225','#1f5fbf22','#f0c35a30','#e67e2230','#c0392b25'];
  for(let k=0;k<K;k++){ const a=X(bounds[k]), b=X(bounds[k+1]); if(b-a<1) continue; s+=`<rect x="${a}" y="30" width="${b-a}" height="${base-30}" fill="${tints[k]}"/><text x="${(a+b)/2}" y="22" text-anchor="middle" style="font-weight:600">${labels[k].k}</text>`; }
  s+=`<line x1="${padL}" y1="${base}" x2="${W-padR}" y2="${base}" stroke="currentColor" stroke-opacity=".6"/>`;
  for(let t=Math.ceil(lo);t<=hi;t++){ s+=`<line x1="${X(t)}" y1="${base-3}" x2="${X(t)}" y2="${base+3}" stroke="currentColor" stroke-opacity=".5"/><text x="${X(t)}" y="${base+17}" text-anchor="middle" style="font-size:11px;fill:var(--mut)">${t}</text>`; }
  res.cuts.slice(0,K-1).forEach((c,i)=>{ if(c<lo||c>hi) return; s+=`<line x1="${X(c)}" y1="30" x2="${X(c)}" y2="${base}" stroke="var(--cut)" stroke-width="1.5" stroke-dasharray="4 3"/><text x="${X(c)}" y="${base+34}" text-anchor="middle" style="fill:var(--cut);font-size:11px">P${i+1}=${f2(c)}</text>`; });
  const pts=res.rows.map(r=>({x:X(r.np),c:r.code,v:r.np})).sort((a,b)=>a.x-b.x); let lvl=0,last=-99;
  pts.forEach(p=>{ lvl=(p.x-last<22)?lvl+1:0; last=p.x; const y=base-14-lvl*15; s+=`<circle cx="${p.x}" cy="${base}" r="4" fill="var(--pri)"/><text x="${p.x}" y="${y}" text-anchor="middle" style="font-size:11px"><title>${esc(p.c)}: N−Prm = ${f2(p.v)}</title>${esc(p.c)}</text>`; });
  return s+'</svg>';
}
function analysisText(res,labels,opts){
  const K=res.K, cutTxt=res.cuts.slice(0,K-1).map((c,i)=>`P${i+1} = ${f2(c)}`).join(', ');
  const groups=labels.map((l,k)=>({l,k,items:res.rows.filter(r=>r.cat===k).map(r=>r.code)})).filter(g=>g.items.length);
  const top2=res.rows.filter(r=>r.cat<=1).length, m=res.rows.length, pct=Math.round(top2/m*100);
  const verdict = pct===100 ? 'Hay un buen consenso en su totalidad' : pct>=80 ? 'Hay un buen consenso, casi la totalidad' : pct>=50 ? 'El consenso es parcial; conviene otra ronda' : 'No hay consenso suficiente; se requiere otra ronda';
  return `<div class="note"><b>Análisis de los resultados.</b> De acuerdo con los puntos de corte (${cutTxt}) y con N = ${f2(res.N)}, ${groups.map(g=>`${g.items.length>1?'los ítems':'el ítem'} <b>${esc(g.items.join(', '))}</b> ${g.items.length>1?'se ubican':'se ubica'} en el intervalo «${g.l.t}» (${g.l.k})`).join('; ')}. ${m?`${top2} de ${m} (${pct} %) quedan en las dos primeras categorías. `:''}<b>${verdict}.</b></div>`;
}

// ============================ 1 · PANEL DE EXPERTOS ============================
function calcK(e){ const kc=(+e.kc||0)/10; const ka=SRC.reduce((s,x)=>s+x.w[e.src[x.k]||'M'],0); const K=Math.round(((kc+ka)/2)*100)/100; const c=S.cfg; const cat=K>=c.altoMin-1e-9?'Alto':K>=c.medioMin-1e-9?'Medio':'Bajo'; return {kc,ka,K,cat}; }
function includedExperts(){ return S.experts.filter(e=>!S.cfg.onlyAM||calcK(e).cat!=='Bajo'); }
function nextId(arr,pre){ let m=0; arr.forEach(x=>{ const g=String(x.id).match(new RegExp('^'+pre+'(\\d+)$')); if(g) m=Math.max(m,+g[1]); }); return m+1; }
function nuevoExperto(){ const n=nextId(S.experts,'E'); return {id:'E'+n,name:'Experto '+n,inst:'',linea:'',fecha:'',kc:7,src:{teo:'M',exp:'M',nac:'M',ext:'M',est:'M',int:'M'}}; }
function addExpert(){ S.experts.push(nuevoExperto()); renderAll(); }
function delExpert(i){ const id=S.experts[i].id; S.experts.splice(i,1); delete S.interviews[id]; S.rounds.forEach(r=>delete r.ratings[id]); renderAll(); }
function setE(i,k,v){ S.experts[i][k]=v; renderAll(); }
function setSrc(i,k,v){ S.experts[i].src[k]=v; renderAll(); }
function setCfg(k,v){ S.cfg[k]=v; renderAll(); }
function genExperts(){ if(!esSim()) return; if(!ovw(S.experts.length||Object.keys(S.interviews).length,'Esto reemplaza el panel de expertos, las entrevistas y las rondas.')) return; const n=+$('nExp').value||15; S.experts=[]; S.interviews={}; S.rounds=[{ratings:{}}]; S.cur=0;
  for(let i=0;i<n;i++){ const e=nuevoExperto(); e.id='E'+(i+1); e.name='Experto '+(i+1); e.inst=pick(['Universidad Antonio Nariño','Universidad Pedagógica Nacional','Universidad del Valle','Universidad de los Andes','Universidad Distrital']); e.linea=pick(['Educación Matemática','Didáctica del álgebra y las funciones','Tecnologías en educación matemática','Pensamiento variacional']); e.fecha='2026-11-'+String(1+Math.floor(Math.random()*28)).padStart(2,'0'); e.kc=10-Math.floor(Math.pow(Math.random(),1.6)*6); const p=rnd(.3,.9);
    SRC.forEach(s=>{ const r=Math.random(); e.src[s.k]= r<p?'A':(r<p+(1-p)*.6?'M':'B'); }); S.experts.push(e); }
  renderAll(); }
function renderK(){
  const c=S.cfg, cnt={Alto:0,Medio:0,Bajo:0}; S.experts.forEach(e=>cnt[calcK(e).cat]++);
  const rows=S.experts.map((e,i)=>{ const k=calcK(e); return `<tr><td>${esc(e.id)}</td><td><input type="text" value="${esc(e.name)}" onchange="setE(${i},'name',this.value)"></td>
   <td><input type="number" min="0" max="10" step="1" value="${e.kc}" onchange="setE(${i},'kc',Math.max(0,Math.min(10,+this.value)))"></td>
   ${SRC.map(s=>`<td>${sel([['A','A'],['M','M'],['B','B']],e.src[s.k],`setSrc(${i},'${s.k}',this.value)`)}</td>`).join('')}
   <td>${f2(k.kc)}</td><td>${f2(k.ka)}</td><td><b>${f2(k.K)}</b></td><td><span class="tag ${k.cat}">${k.cat}</span></td><td><button class="sm" onclick="delExpert(${i})" title="Quitar">✕</button></td></tr>`; }).join('');
  $('t-k').innerHTML=`<div class="card"><h2>Selección de expertos: coeficiente de competencia</h2>
  <p class="mut">Cada experto se autoevalúa (Kc: 0–10, se multiplica por 0,1) y marca el grado de influencia (A alto, M medio, B bajo) de seis fuentes de argumentación, cuya suma es el coeficiente de argumentación Ka. <b>K = (Kc + Ka) / 2.</b></p>
  <div class="row"><button class="pri" onclick="addExpert()">+ Añadir experto</button>${esSim()?` Generar <input id="nExp" type="number" min="1" max="60" value="${S.experts.length||15}"> expertos al azar <button onclick="genExperts()">Generar</button>`:''}</div>
  <div class="row">Categorías: Alto si K ≥ <input type="number" step="0.05" min="0" max="1" value="${c.altoMin}" onchange="setCfg('altoMin',+this.value)"> · Medio si K ≥ <input type="number" step="0.05" min="0" max="1" value="${c.medioMin}" onchange="setCfg('medioMin',+this.value)"> · Bajo si es menor.
   <label><input type="checkbox" ${c.onlyAM?'checked':''} onchange="setCfg('onlyAM',this.checked)"> Solo Alto y Medio participan en las rondas</label></div>
  <div class="note warn">Los umbrales por defecto (0,8 y 0,7) reproducen la tabla de tu profesor (K = 0,7 es Medio; 0,6 y 0,5 son Bajo). Algunos textos usan 0,5 como límite entre Medio y Bajo; puedes ajustarlo aquí.</div>
  <div class="scroll"><table><tr><th>ID</th><th>Nombre</th><th>Kc (0–10)</th>${SRC.map(s=>`<th title="${esc(s.t)}">${esc(s.t.length>22?s.t.slice(0,20)+'…':s.t)}</th>`).join('')}<th>Kc</th><th>Ka</th><th>K</th><th>Categoría</th><th></th></tr>${rows||`<tr><td colspan="14" class="mut">Sin expertos. ${esSim()?'Añade uno o genera un panel aleatorio.':'Añade a cada experto con sus respuestas reales.'}</td></tr>`}</table></div>
  <p>Alto: <span class="tag Alto">${cnt.Alto}</span> · Medio: <span class="tag Medio">${cnt.Medio}</span> · Bajo: <span class="tag Bajo">${cnt.Bajo}</span> · Participan en las rondas: <b>${includedExperts().length}</b> de ${S.experts.length}</p></div>`;
}

function catOf(kind,q){ return (kind==='ent'?BANK:CAT_DOC)[q]; }

function togCode(kind,ref,q,idx){ const o=codeObj(kind,ref,q), n=catOf(kind,q)[idx][0]; let cs=parseCodes(o.codes); cs=cs.includes(n)?cs.filter(x=>x!==n):cs.concat(n); o.codes=cs.join(', '); save(); reCode(kind); }
function setExtra(kind,ref,q,v){ const o=codeObj(kind,ref,q), nm=catOf(kind,q).map(x=>x[0]); o.codes=parseCodes(o.codes).filter(x=>nm.includes(x)).concat(parseCodes(v).filter(x=>!nm.includes(x))).join(', '); save(); reCode(kind); }
function checksHTML(kind,ref,q){ const o=codeObj(kind,ref,q), cs=parseCodes(o.codes), cat=catOf(kind,q), nm=cat.map(x=>x[0]), extra=cs.filter(x=>!nm.includes(x)).join(', ');

  $('t-enc').innerHTML=`<div class="card"><h2>Encuesta diagnóstica a docentes (escala S=5, CS=4, AV=3, RV=2, NU=1)</h2>

// ============================ 4 · INDICADORES Y RONDAS ============================
function setInd(i,k,v){
  if(k==='code'){ v=String(v).trim(); const old=S.indicators[i].code;
    if(!v||S.indicators.some((x,j)=>j!==i&&x.code===v)){ alert('El código del indicador no puede estar vacío ni repetirse.'); renderAll(); return; }
    S.rounds.forEach(r=>Object.values(r.ratings).forEach(o=>{ if(Object.prototype.hasOwnProperty.call(o,old)){ o[v]=o[old]; delete o[old]; } })); }
  S.indicators[i][k]=v; renderAll(); }
function addInd(){ let n=S.indicators.length+1; while(S.indicators.some(x=>x.code==='X'+n)) n++; S.indicators.push({code:'X'+n,factor:'Nuevo',text:''}); renderAll(); }
function delInd(i){ const c=S.indicators[i].code; S.indicators.splice(i,1); S.rounds.forEach(r=>Object.values(r.ratings).forEach(o=>delete o[c])); renderAll(); }
function curR(){ return S.rounds[S.cur]; }
function setRound(v){ S.cur=+v; renderAll(); }
function setRate(id,j,v){ const code=S.indicators[+j].code, r=curR().ratings; (r[id]=r[id]||{})[code]=v; renderAll(); }
function genRound(){ if(!esSim()) return; const R=curR(); if(!ovw(Object.keys(R.ratings).length,'Esto reemplaza las valoraciones de la ronda '+(S.cur+1)+'.')) return; const lv=$('lvRon').value; S.cfg.level=lv; const bias=S.indicators.map(()=>rnd(-.6,.5)); R.ratings={};
  includedExperts().forEach(e=>{ R.ratings[e.id]={}; S.indicators.forEach((ind,j)=>{ R.ratings[e.id][ind.code]=VAL[5-sampleLikert(MU[lv]+bias[j])].k; }); }); renderAll(); }
function nextRound(conv){ if(conv&&!esSim()) return; const prev=curR(), nr={ratings:{}};
  if(conv){ const med={}; S.indicators.forEach(ind=>{ const v=Object.values(prev.ratings).map(o=>VAL.findIndex(x=>x.k===o[ind.code])).filter(x=>x>=0).sort((a,b)=>a-b); med[ind.code]=v.length?v[Math.floor(v.length/2)]:0; });
    Object.entries(prev.ratings).forEach(([id,o])=>{ nr.ratings[id]={}; S.indicators.forEach(ind=>{ let v=VAL.findIndex(x=>x.k===o[ind.code]); if(v<0) return; if(v!==med[ind.code] && Math.random()<.75) v+=Math.sign(med[ind.code]-v); nr.ratings[id][ind.code]=VAL[v].k; }); }); }
  S.rounds.push(nr); S.cur=S.rounds.length-1; renderAll(); }
function delRound(){ if(S.rounds.length<2) return; S.rounds.splice(S.cur,1); S.cur=Math.max(0,S.cur-1); renderAll(); }
function ratingsOf(R){ const inc=new Set(includedExperts().map(e=>e.id)); return Object.entries(R.ratings).filter(([id])=>inc.has(id)).map(([,o])=>o); }
function roundResult(R){ const rr=ratingsOf(R); const rows=S.indicators.map(ind=>({code:ind.code,counts:VAL.map(v=>rr.filter(o=>o[ind.code]===v.k).length)})); return thorgenson(rows,5); }
function renderRon(){
  const inc=includedExperts(), R=curR();
  const indRows=S.indicators.map((x,i)=>`<tr><td><input type="text" style="width:56px" value="${esc(x.code)}" onchange="setInd(${i},'code',this.value.trim())"></td><td><input type="text" value="${esc(x.factor)}" onchange="setInd(${i},'factor',this.value)"></td><td class="l"><input type="text" style="width:100%;min-width:360px" value="${esc(x.text)}" onchange="setInd(${i},'text',this.value)"></td><td><button class="sm" onclick="delInd(${i})">✕</button></td></tr>`).join('');
  const grid=inc.map(e=>`<tr><td title="${esc(e.name)}">${esc(e.id)}</td>${S.indicators.map((ind,j)=>`<td>${sel(VAL.map(v=>[v.k,v.k]),(R.ratings[e.id]||{})[ind.code]||'',`setRate('${e.id}',${j},this.value)`,true)}</td>`).join('')}</tr>`).join('');
  const comp=S.rounds.map((r,i)=>{ const x=roundResult(r); const n=ratingsOf(r).length; const t2=x.rows.filter(q=>q.cat<=1).length; return `<tr><td>Ronda ${i+1}</td><td>${n}</td>${x.cuts.slice(0,4).map(c=>`<td>${f2(c)}</td>`).join('')}<td>${f2(x.N)}</td><td>${t2} / ${x.rows.length}</td><td>${x.rows.length?Math.round(t2/x.rows.length*100):0} %</td></tr>`; }).join('');
  $('t-ron').innerHTML=`<div class="card"><h2>Indicadores propuestos</h2>
   <p class="mut">Propuesta para el modelo didáctico de Comprensión Robusta Matemática (funciones, educación media, aplicativos web): 3 indicadores por cada proceso cognoscitivo (Abstraer el argumento, Formular la función, Valorar la referencia), 2 de mediación tecnológica y 2 de comprensión robusta y evaluación del modelo. Edítalos libremente; se recalcula todo.</p>
   <details><summary>Ver / editar los ${S.indicators.length} indicadores</summary><div class="scroll"><table><tr><th>Código</th><th>Factor</th><th>Descripción</th><th></th></tr>${indRows}</table></div><button onclick="addInd()">+ Añadir indicador</button> <button onclick="resetInd()">Restablecer a la propuesta de mi tesis</button></details></div>
  <div class="card"><h2>Ronda de validación por expertos (MA, BA, A, PA, I)</h2>
   <div class="row">Ronda: ${sel(S.rounds.map((_,i)=>[i,'Ronda '+(i+1)]),S.cur,'setRound(this.value)')}
   ${esSim()?'<button onclick="nextRound(true)" title="Los expertos reconsideran hacia la mediana del grupo">+ Nueva ronda convergente</button> ':''}<button onclick="nextRound(false)">+ Nueva ronda ${esSim()?'vacía':''}</button> <button onclick="delRound()">Eliminar esta ronda</button></div>
   ${esSim()?`<div class="row">Generar respuestas de esta ronda con tendencia <select id="lvRon"><option value="alto"${S.cfg.level==='alto'?' selected':''}>alta (MA/BA)</option><option value="medio"${S.cfg.level==='medio'?' selected':''}>media</option><option value="bajo"${S.cfg.level==='bajo'?' selected':''}>baja</option></select> <button class="pri" onclick="genRound()">Generar respuestas</button></div>`:''}
   ${inc.length?'':'<div class="note warn">No hay expertos participantes. Crea el panel en la pestaña 1.</div>'}
   <div class="scroll"><table><tr><th>Experto</th>${S.indicators.map(x=>`<th title="${esc(x.text)}">${esc(x.code)}</th>`).join('')}</tr>${grid}</table></div></div>
  <div class="card"><h2>Resultado de la ronda ${S.cur+1} (n = ${ratingsOf(R).length} expertos)</h2>${resultHTML(roundResult(R),VAL,{rowName:'Indicador'})}</div>
  <div class="card"><h2>Comparación entre rondas</h2><table><tr><th>Ronda</th><th>Expertos</th><th>P1</th><th>P2</th><th>P3</th><th>P4</th><th>N</th><th>Indicadores en MA o BA</th><th>%</th></tr>${comp}</table>
   <p class="mut">Criterio práctico: se detiene la técnica cuando el consenso se estabiliza entre dos rondas. Confirma con tu profesor el criterio exacto de parada.</p></div>`;
}

  // 6. indicadores finales
  const okN=resL.rows.filter(r=>r.cat<=1).length, m=resL.rows.length;
  const indTable=resL.rows.map(r=>{ const ind=S.indicators.find(x=>x.code===r.code)||{}; return `<tr><td><b>${esc(r.code)}</b></td><td class="l">${esc(ind.factor||'')}</td><td class="l">${esc(ind.text||'')}</td><td>${f2(r.np)}</td><td><b>${VAL[r.cat].k}</b></td><td>${r.cat<=1?'Sí':'No'}</td></tr>`; }).join('');
  const sinCons=resL.rows.filter(r=>r.cat>1).map(r=>r.code);
  const sec6=m?`<p>Según la última ronda (ronda ${L+1}), <b>${okN} de ${m}</b> indicadores (${Math.round(okN/m*100)} %) quedaron en MA o BA y se consideran consensuados.</p>
   <table><tr><th>Código</th><th class="l">Factor</th><th class="l">Indicador</th><th>N − Prm</th><th>Categoría</th><th>¿Consensuado?</th></tr>${indTable}</table>`:'<p class="mut">Sin resultados de indicadores.</p>';
  // 7. conclusiones
  const concl=[]; if(N) concl.push(`El panel quedó conformado por ${inc.length} expertos con competencia alta o media de un total de ${N}.`);
  if(nT) concl.push(`En la encuesta a ${nT} docentes, ${nOk} de ${resE.rows.length} ítems quedan en las categorías S o CS (N = ${f2(resE.N)}).`);
  if(m) concl.push(`En la validación de indicadores, N = ${f2(resL.N)} y ${okN} de ${m} indicadores alcanzan consenso (MA o BA).${sinCons.length?` Sin consenso: ${esc(sinCons.join(', '))}; requieren otra ronda o reformulación.`:' Hay consenso en la totalidad de los indicadores.'}`);
  if(S.rounds.length>1&&hayR){ const a=roundResult(S.rounds[0]), b=resL; concl.push(`Entre la ronda 1 y la ronda ${L+1}, N pasó de ${f2(a.N)} a ${f2(b.N)}.`); }
  const sim=esSim()?`<div class="note warn"><b>Datos simulados.</b> Este informe se generó con respuestas simuladas para ensayar el procedimiento. No corresponde a un panel real de expertos ni a docentes encuestados.</div>`:'';
  $('t-inf').innerHTML=`<div class="card noprint"><h2>Informe de resultados</h2>
   <p class="mut">Se arma solo con los datos que tengas en las pestañas 1 a 4. Guárdalo como PDF con «Imprimir» (elige «Guardar como PDF») o descárgalo como HTML.</p>
   <div class="row">Título <input type="text" style="width:340px" value="${esc(c.repTitle)}" onchange="setRep('repTitle',this.value)"> Autor <input type="text" style="width:240px" value="${esc(c.repAuthor)}" onchange="setRep('repAuthor',this.value)"></div>
   <div class="row"><span class="mut">${esSim()?'Modo simulación: el informe se marca automáticamente como «datos simulados».':'Modo datos reales: el informe no lleva la marca de simulado.'}</span>
   <button class="pri" onclick="window.print()">Imprimir / Guardar como PDF</button> <button onclick="descargarInforme()">Descargar HTML</button></div></div>
  <div id="informe" class="card rep"><h1>${esc(c.repTitle)}</h1>
   <p class="mut">Doctorado en Educación Matemática · Universidad Antonio Nariño${c.repAuthor?' · '+esc(c.repAuthor):''} · ${hoy}</p>${sim}
   <h2>1. Metodología</h2>
   <p>Se aplicó el método Delphi con el modelo de Thorgenson. Las categorías cualitativas ordenadas se convierten en valores reales continuos mediante la función recíproca de la distribución normal: con las frecuencias absolutas se obtienen las relativas acumuladas, se les aplica la inversa de la normal (los valores 0 y 1 se truncan en ∓${Z_MAX}), y el promedio de cada columna sobre todos los ítems define los puntos de corte P1…Pk. Cada ítem tiene un valor N − Prm, donde Prm es el promedio de sus valores z y N es el promedio de los Prm. El ítem se ubica en la primera categoría cuyo punto de corte supera su N − Prm.</p>
   <h2>2. Selección de expertos</h2>${sec2}
   <h2>3. Encuesta a docentes</h2>${sec3}
   <h2>4. Entrevista a expertos</h2>${sec4}
   <h2>5. Validación de indicadores por expertos</h2>${sec5}
   <h2>6. Indicadores consensuados</h2>${sec6}
   <h2>7. Conclusiones</h2>${concl.length?'<ul>'+concl.map(x=>`<li>${x}</li>`).join('')+'</ul>':'<p class="mut">Aún no hay datos.</p>'}</div>`;
}
function descargarInforme(){ const css=document.querySelector('style').textContent; const html='<!doctype html><html lang="es"><head><meta charset="utf-8"><title>'+esc(S.cfg.repTitle)+'</title><style>'+css+'</style></head><body><main>'+$('informe').outerHTML+'</main></body></html>';
  const b=new Blob([html],{type:'text/html'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='informe_delphi_multicrea.html'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); }

// ============================ COPIAR EJEMPLO DEL PROFESOR A LOS DATOS DE TRABAJO ============================
function expandir(counts,j){ const a=[]; counts.forEach((c,k)=>{ for(let i=0;i<c;i++) a.push(k); }); const r=(j*7)%a.length; return a.slice(r).concat(a.slice(0,r)); }
function cargarEjemplo(key){ if(!esSim()) return; const p=PRESETS[key], n=sumArr(p.rows[0][1]);
  const hay = key==='enc' ? S.teachers.length : (S.experts.length || Object.keys(curR().ratings).length);
  const msg = key==='enc'
    ? 'Esto reemplaza las respuestas de la encuesta (pestaña 2) por '+n+' docentes que reproducen el ejemplo. Las preguntas A–G del ejemplo quedan como P1–P7 y P8–P10 sin respuesta.'
    : 'Esto reemplaza el panel de expertos, las entrevistas, los indicadores y las rondas (pestañas 1, 3 y 4) por '+n+' expertos de ejemplo y los 13 indicadores del profesor.';
  if(hay && !confirm(msg+'\n\nSe descargará antes una copia de seguridad JSON de tus datos actuales. ¿Continuar?')) return;
  if(hay) exportar();
  if(key==='enc'){
    S.teachers=Array.from({length:n},(_,i)=>({id:'D'+(i+1),a:Array(10).fill(0)}));
    p.rows.forEach((r,j)=>{ expandir(r[1],j).forEach((k,i)=>{ S.teachers[i].a[j]=LIK[k].v; }); });
    renderAll(); goTab('t-enc');
  } else {
    S.experts=Array.from({length:n},(_,i)=>({id:'E'+(i+1),name:'Experto ejemplo '+(i+1),kc:10,src:{teo:'A',exp:'A',nac:'A',ext:'A',est:'A',int:'A'}}));
    S.interviews={}; S.indicators=p.rows.map(r=>({code:r[0],factor:'Factor '+r[0][0],text:'Indicador '+r[0]+' (ejemplo del profesor)'}));
    const R={ratings:{}}; S.experts.forEach(e=>R.ratings[e.id]={});
    p.rows.forEach((r,j)=>{ expandir(r[1],j).forEach((k,i)=>{ R.ratings['E'+(i+1)][r[0]]=VAL[k].k; }); });
    S.rounds=[R]; S.cur=0; renderAll(); goTab('t-ron');
  } }

// ============================ DEMO, EXPORTAR, IMPORTAR ============================
function demoCompleta(){ if(!esSim()) return; if((S.experts.length||S.teachers.length)&&!confirm('Esto reemplaza los datos actuales por una simulación completa. ¿Continuar?')) return;
  S=nuevoEstado(); S.mode='sim'; S.cfg.onlyAM=true; renderAllSilent(); QUIET=true;
  try{ $('nExp').value=15; genExperts(); genInterviews();
  $('nDoc').value=30; $('lvDoc').value='alto'; genTeachers();
  $('lvRon').value='alto'; genRound(); nextRound(true); }finally{ QUIET=false; } goTab('t-ron'); }
function renderAllSilent(){ renderModo(); renderK(); renderEnc(); renderEnt(); renderRon(); renderVer(); renderInf(); }
function exportar(){ const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='delphi_multicrea_datos.json'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); }
function validarEstado(P){
  const obj=x=>x&&typeof x==='object'&&!Array.isArray(x), idOk=x=>typeof x==='string'&&/^[A-Za-z0-9_-]{1,20}$/.test(x);
  if(!obj(P)) return 'el archivo no contiene un objeto de datos';
  if(!Array.isArray(P.experts)) return 'falta la lista de expertos';
  const ids=new Set(); for(const e of P.experts){ if(!obj(e)||!idOk(e.id)) return 'hay un experto sin ID válido'; if(ids.has(e.id)) return 'hay IDs de expertos repetidos ('+e.id+')'; ids.add(e.id); if(!obj(e.src)) return 'el experto '+e.id+' no tiene fuentes de argumentación'; }
  if(!Array.isArray(P.teachers)) return 'falta la lista de docentes';
  for(const t of P.teachers){ if(!obj(t)||!idOk(t.id)||!Array.isArray(t.a)) return 'hay un docente con datos no válidos'; }
  if(!obj(P.interviews)) return 'faltan las entrevistas';
  if(!Array.isArray(P.indicators)||!P.indicators.length) return 'faltan los indicadores';
  const cods=new Set(); for(const x of P.indicators){ if(!obj(x)||typeof x.code!=='string'||!x.code.trim()) return 'hay un indicador sin código'; if(cods.has(x.code)) return 'hay códigos de indicador repetidos ('+x.code+')'; cods.add(x.code); }
  if(!Array.isArray(P.rounds)||!P.rounds.length) return 'faltan las rondas';
  for(const r of P.rounds){ if(!obj(r)||!obj(r.ratings)) return 'hay una ronda con valoraciones no válidas'; for(const o of Object.values(r.ratings)) if(!obj(o)) return 'hay valoraciones no válidas'; }
  if(P.cfg!==undefined&&!obj(P.cfg)) return 'la configuración no es válida';
  return null; }
function importar(inp){ const f=inp.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{
  let P; try{ P=JSON.parse(r.result); }catch(e){ alert('El archivo no es un JSON válido.'); return; }
  const err=validarEstado(P); if(err){ alert('No se importó el archivo: '+err+'.'); return; }
  if(hayDatos()&&!confirm('Importar reemplaza los datos actuales por los del archivo.\n\n¿Continuar?')) return;
  const old=S;
  try{ const N=Object.assign(nuevoEstado(),P); N.cfg=Object.assign(nuevoEstado().cfg,P.cfg||{}); N.mode=modoDe(P);
    N.teachers=P.teachers.map(t=>Object.assign({},t,{a:Array.from({length:10},(_,j)=>+t.a[j]||0)}));
    Object.keys(N.interviews).forEach(k=>{ if(!Array.isArray(N.interviews[k])) delete N.interviews[k]; });
    N.cur=Number.isInteger(P.cur)&&P.cur>=0&&P.cur<N.rounds.length?P.cur:0;
    S=N; migrarInd(); renderAll(); }
  catch(e){ S=old; try{ renderAll(); }catch(_){} alert('No se pudo importar el archivo; se conservaron los datos actuales.'); } };
  r.readAsText(f); inp.value=''; }
function reiniciar(){ if(confirm('¿Borrar todos los datos del simulador?')){ S=nuevoEstado(); renderAll(); } }

renderAll();
let t0='t-k'; try{ t0=sessionStorage.getItem('tab')||'t-k'; }catch(e){} goTab(t0);
</script>
